let token="",email="";const $=id=>document.getElementById(id);
const el=c=>document.querySelector(`[name="${c}"]`);const num=c=>parseFloat(el(c)?.value)||0;
function build(){const f=$("form");let sec=0;let d;
F.forEach(x=>{if(x.sec!==sec){sec=x.sec;d=document.createElement("details");d.innerHTML=`<summary>${x.sec}. ${x.secname}</summary>`;if(sec==1)d.open=true;f.appendChild(d)}
if(x.skip){if(!d.querySelector(".note"))d.insertAdjacentHTML("beforeend",'<div class="note">Photos, documents, diagram and signatures are added in the next steps.</div>');return}
let i;const o=x.opts?x.opts.split(" | "):null;
if(x.type=="Dropdown + File"&&o)i=`<select name="${x.col}" style="pointer-events:none;background:#eaf1f8"><option value="">Pending</option>${(o||["Uploaded"]).map(v=>`<option>${v}</option>`).join("")}</select><button type="button" onclick="openCam('${x.col}')">Take photo</button><img id="p_${x.col}" hidden style="max-width:100%;margin-top:6px">`;else if(o)i=`<select name="${x.col}"><option value="">Select</option>${o.map(v=>`<option>${v}</option>`).join("")}</select>`;
else if(x.type=="GPS (auto)")i=`<input name="${x.col}" readonly placeholder="Not captured"><button type="button" onclick="gps('${x.col}')">Capture current location</button>`;
else if(x.type.startsWith("Long"))i=`<textarea name="${x.col}" rows="2"></textarea>`;
else{const t=x.type.startsWith("Number")?'type="number" inputmode="decimal" step="any"':x.type.startsWith("Phone")?'type="tel" maxlength="10" pattern="[0-9]{10}"':x.type=="Email"?'type="email"':x.type.startsWith("Date")?'type="date"':'type="text"';
i=`<input autocomplete="off" name="${x.col}" ${t} ${x.calc?'readonly placeholder="Auto"':''} value="${x.def||""}">`}
d.insertAdjacentHTML("beforeend",`<div class="f ${x.req=="Yes"&&!x.calc?"req":""} ${x.req=="Yes"?"":"opt"}" data-c="${x.col}"><label>${x.label}</label>${i}</div>`)});
document.querySelectorAll("details").forEach(d=>{if(!d.querySelector(".f:not(.opt)"))d.classList.add("opt")});
const sd=el("survey_date");if(sd&&!sd.value)sd.value=new Date().toISOString().slice(0,10);
f.addEventListener("input",()=>{calc();saveDraft()});loadDraft();calc()}
function calc(){const set=(c,v)=>{const e=el(c);if(e)e.value=v};
set("average_daily_consumption",(num("average_monthly_consumption")/30).toFixed(1));
set("total_dc_capacity",(num("number_of_panels")*num("panel_wattage")/1000).toFixed(2));
set("total_estimated_dc_cable",num("panel_to_dcdb")+num("dcdb_to_inverter"));
set("total_estimated_ac_cable",num("inverter_to_acdb_cable")+num("acdb_to_generation_meter")+num("generation_meter_to_net_meter"));
const w=num("panel_wattage");set("estimated_panel_count",w?Math.ceil(num("recommended_solar_capacity")*1000/w):"")}
function gps(c){navigator.geolocation.getCurrentPosition(p=>{el(c).value=`${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)} (±${Math.round(p.coords.accuracy)}m)`;saveDraft()},
e=>alert("Location blocked. Allow location for this site."),{enableHighAccuracy:true,timeout:20000})}
let LAST="",SID=localStorage.getItem("ldbs_sid")||"",CUR=null,POS=null,WID=null;
function data(){const o={survey_id:SID};F.forEach(x=>{const e=el(x.col);if(e)o[x.col]=e.value});return o}
function saveDraft(m){localStorage.setItem("ldbs_draft",JSON.stringify(data()));if(m)$("msg").textContent="Draft saved on this phone."}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem("ldbs_draft")||"{}");for(const k in d)if(el(k)&&d[k])el(k).value=d[k]}catch(e){}}
async function submitSurvey(){document.querySelectorAll(".err").forEach(n=>n.classList.remove("err"));calc();
const bad=[...document.querySelectorAll(".req")].filter(n=>!n.querySelector("input,select,textarea").value.trim());
bad.forEach(n=>n.classList.add("err"));
if(bad.length){bad[0].closest("details").open=true;bad[0].scrollIntoView({block:"center"});$("msg").textContent=`${bad.length} required field(s) missing.`;return}
$("msg").textContent="Saving line diagram...";try{await uploadDiagram()}catch(e){$("msg").textContent="Line diagram failed: "+e.message;return}
$("msg").textContent="Submitting...";
try{const r=await api({data:data(),status:"Submitted"});
if(r.ok){localStorage.removeItem("ldbs_sid");SID="";LAST=r.survey_id;$("conf").hidden=false;$("msg").textContent="Submitted. Survey ID: "+r.survey_id;localStorage.removeItem("ldbs_draft")}else $("msg").textContent="Error: "+r.error}
catch(e){$("msg").textContent="Network error. Your draft is kept; try again."}}
async function sendConf(){const em=el("customer_email")?el("customer_email").value:"";if(!confirm("Send the confirmation link to "+em+" ?\n\nCheck this is the CUSTOMER's email, not yours."))return;$("msg").textContent="Sending...";const r=await api({action:"sendConfirmation",survey_id:LAST});$("msg").textContent=r.ok?r.message:"Error: "+r.error}
const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const V=c=>(el(c)&&el(c).value.trim())||"-";
function diagram(){
const bx=(x,y,w,h,f,...L)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${f}" stroke="#1f4e78" stroke-width="2"/>`+L.filter(Boolean).map((s,i,a)=>`<text x="${x+w/2}" y="${y+h/2-(a.length-1)*9+5+i*18}" text-anchor="middle" font-size="${i?12:14}" ${i?"":'font-weight="bold" '}fill="#10243a">${E(s)}</text>`).join("");
const ln=(x1,y1,x2,y2,m,dy,dx,col)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col||"#1f4e78"}" stroke-width="3" marker-end="url(#a)"/><text x="${(x1+x2)/2+(dx||0)}" y="${(y1+y2)/2+(dy==null?-10:dy)}" text-anchor="middle" font-size="13" font-weight="bold" fill="#b00020">${E(m)} m</text>`;
const kw=(num("number_of_panels")*num("panel_wattage")/1000).toFixed(2),X=i=>20+i*178,Y=100,W=130,H=80,C=Y+H/2,G="#2e7d32";
const boxes=[["#d9ead3","SOLAR PANELS",V("number_of_panels")+" x "+V("panel_wattage")+" Wp",kw+" kWp"],["#fff3cd","DCDB"],["#cfe2f3","INVERTER",V("inverter_capacity")+" kW",V("inverter_make")],["#fff3cd","ACDB"],["#fff3cd","GENERATION","METER"],["#fce5cd","NET METER"]];
const links=["panel_to_dcdb","dcdb_to_inverter","inverter_to_acdb_cable","acdb_to_generation_meter","generation_meter_to_net_meter"];
const earth=["panel_earth_to_dcdb_earth","dcdb_earth_to_earth_pit","acdb_earth_to_earth_pit","lightning_arrestor_earth_to_earth_pit"].reduce((s,c)=>s+num(c),0);
return `<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="440" viewBox="0 0 1060 440" font-family="Arial,sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0,12 5,0 10" fill="#1f4e78"/></marker></defs><rect width="1060" height="440" fill="#fff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#1f4e78">LINE DIAGRAM - ${E(SID||"survey")} - ${E(V("customer_name"))}</text>
${boxes.map((b,i)=>bx(X(i),Y,W,H,...b)).join("")}${links.map((l,i)=>ln(X(i)+W,C,X(i+1),C,V(l))).join("")}
${bx(20,340,1020,50,"#e6e6e6","EARTH PIT CHAMBER")}
<polyline points="85,180 85,250 263,250" fill="none" stroke="${G}" stroke-width="3"/><circle cx="263" cy="250" r="5" fill="${G}"/><text x="174" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b00020">${E(V("panel_earth_to_dcdb_earth"))} m</text>${ln(X(1)+65,Y+H,X(1)+65,340,V("dcdb_earth_to_earth_pit"),4,36,G)}${ln(X(3)+65,Y+H,X(3)+65,340,V("acdb_earth_to_earth_pit"),4,36,G)}
${bx(800,230,210,55,"#e6e6e6","LIGHTNING ARRESTOR")}${ln(905,285,905,340,V("lightning_arrestor_earth_to_earth_pit"),4,36,G)}
<text x="20" y="425" font-size="13" fill="#10243a">DC cable: ${V("total_estimated_dc_cable")} m   |   AC cable: ${V("total_estimated_ac_cable")} m   |   Earth cable: ${earth} m   |   Generated ${E(new Date().toLocaleString("en-IN"))}</text></svg>`}
function showDiagram(){calc();$("dgs").innerHTML=diagram();$("dg").hidden=false}
async function uploadDiagram(){const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(diagram());await img.decode();const c=document.createElement("canvas");c.width=2120;c.height=880;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
const r=await api({action:"diagram",survey_id:SID,image:c.toDataURL("image/png").split(",")[1]});if(!r.ok)throw new Error(r.error)}
async function myList(){$("ml").hidden=false;$("mls").textContent="Loading...";const r=await api({action:"list"});if(!r.ok){$("mls").textContent=r.error;return}

async function resend(id,em){const n=prompt("Customer email to send the link to:",em);if(n===null)return;const r=await api({action:"sendConfirmation",survey_id:id,email:n.trim()});alert(r.ok?r.message:"Error: "+r.error);myList()}
async function cancelLink(id){if(!confirm("Cancel the active link for "+id+"?"))return;const r=await api({action:"cancelConfirmation",survey_id:id});alert(r.ok?r.message:"Error: "+r.error);myList()}
async function api(o){o.token=token;return (await fetch(CFG.API_URL,{method:"POST",body:JSON.stringify(o)})).json()}
const ll=s=>{const m=/(-?\d+\.\d+),\s*(-?\d+\.\d+)/.exec(s||"");return m?[+m[1],+m[2]]:null};
async function openCam(c){CUR=F.find(x=>x.col==c);
if(!ll(el("gps_google_maps_location")?.value))return alert("Capture the site location in Section 1 first.");
if(!SID){$("msg").textContent="Creating survey record...";let r;try{r=await api({data:data(),status:"Draft"})}catch(e){return alert("Cannot reach the server ("+e.message+"). Check the Web app URL in this page, and that the Web app access is set to Anyone.")}if(!r.ok)return alert(r.error);SID=r.survey_id;localStorage.setItem("ldbs_sid",SID);$("msg").textContent="Survey "+SID}
try{$("v").srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920}},audio:false})}catch(e){return alert("Camera blocked. Allow camera for this site.")}
POS=null;$("shot").disabled=true;$("cam").hidden=false;$("ct").textContent=CUR.label+" - waiting for GPS...";
WID=navigator.geolocation.watchPosition(p=>{POS=p;$("shot").disabled=false;$("ct").textContent=`${CUR.label} | GPS ±${Math.round(p.coords.accuracy)}m`},()=>{$("ct").textContent="GPS blocked. Allow location."},{enableHighAccuracy:true})}
function closeCam(){navigator.geolocation.clearWatch(WID);const s=$("v").srcObject;s&&s.getTracks().forEach(t=>t.stop());$("cam").hidden=true}
async function shoot(){const v=$("v"),k=Math.min(1,1600/v.videoWidth),c=document.createElement("canvas");c.width=v.videoWidth*k;c.height=v.videoHeight*k;
const g=c.getContext("2d");g.drawImage(v,0,0,c.width,c.height);const la=POS.coords.latitude.toFixed(6),lo=POS.coords.longitude.toFixed(6),ac=Math.round(POS.coords.accuracy),now=new Date();
const L=[`${CUR.label} | ${la},${lo} (±${ac}m)`,`${now.toLocaleString("en-IN")} | ${email} | ${SID} | ${el("customer_name").value}`],h=22*L.length+10;
g.fillStyle="rgba(0,0,0,.6)";g.fillRect(0,c.height-h,c.width,h);g.fillStyle="#fff";g.font=Math.max(14,c.width/70)+"px Arial";L.forEach((s,i)=>g.fillText(s,8,c.height-h+22*(i+1)-2));
const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.8)),buf=await blob.arrayBuffer();
const sha=[...new Uint8Array(await crypto.subtle.digest("SHA-256",buf))].map(b=>b.toString(16).padStart(2,"0")).join("");
const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(blob)});
closeCam();$("msg").textContent="Uploading photo...";
try{const r=await api({action:"photo",survey_id:SID,field:CUR.col,label:CUR.label,lat:la,lng:lo,acc:ac,time:now.toISOString(),sha,image:b64});
if(r.ok){el(CUR.col).value="Uploaded";const p=$("p_"+CUR.col);p.src=URL.createObjectURL(blob);p.hidden=false;$("msg").textContent="Photo saved: "+CUR.label;saveDraft()}else{$("msg").textContent="Rejected: "+r.error}}
catch(e){$("msg").textContent="Upload failed. Check network and retake."}}
window.onload=()=>{build();const t=setInterval(()=>{if(window.google&&google.accounts){clearInterval(t);
google.accounts.id.initialize({client_id:CFG.CLIENT_ID,callback:r=>{token=r.credential;email=JSON.parse(atob(r.credential.split(".")[1])).email;
$("who").textContent=email;$("login").hidden=true;$("app").hidden=false}});
google.accounts.id.renderButton($("gbtn"),{theme:"filled_blue",size:"large"})}},200)};
</script></body></html>
