<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LDBS - Confirm your solar requirements</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6fa;color:#1b2430}header{background:#1f4e78;color:#fff;padding:14px 16px}main{padding:14px;max-width:640px;margin:auto}
table{width:100%;border-collapse:collapse;background:#fff;margin:10px 0}td{border:1px solid #d5dce4;padding:8px;font-size:14px}td:first-child{background:#eef3f8;width:45%}
input[type=text],input:not([type]){width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #b8c2cc;border-radius:6px;margin:4px 0 12px}
canvas{width:100%;background:#fff;border:1px solid #b8c2cc;border-radius:6px;touch-action:none}button{padding:12px 16px;font-size:16px;border:0;border-radius:6px;background:#1f4e78;color:#fff;margin:6px 4px 6px 0}button.s{background:#6b7785}
.ck{display:flex;gap:8px;margin:12px 0;font-size:14px}[hidden]{display:none!important}#m{font-weight:bold;padding:6px 0}</style></head><body>
<header>LDBS India - Confirm your solar requirements</header><main><div id="st">Loading...</div>
<div id="box" hidden><table id="tb"></table><button id="ob" type="button">Send verification code to <span id="em"></span></button>
<label>6-digit code from the email</label><input id="otp" inputmode="numeric" maxlength="6">
<label>Your full name</label><input id="nm" type="text"><label>Draw your signature below</label><canvas id="cv" width="600" height="200"></canvas><button class="s" type="button" onclick="clr()">Clear signature</button>
<label class="ck"><input type="checkbox" id="ag"><span id="cs"></span></label><button id="cb" type="button">Confirm</button><div id="m"></div></div></main>
<script>
const API="https://script.google.com/macros/s/AKfycbxl1lpWQdcXdixrgxFyZscqg0V-m2U_gGchoqea-xc0nuADEg7Nf3TxgnMjiMZVXVOfEA/exec",T=new URLSearchParams(location.search).get("t"),$=i=>document.getElementById(i);
const call=async o=>{o.ct=T;return(await fetch(API,{method:"POST",body:JSON.stringify(o)})).json()};
let POS=null,drawn=false,dn=false;navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>POS=p.coords,()=>{},{enableHighAccuracy:true});
const cv=$("cv"),g=cv.getContext("2d");g.lineWidth=3;g.lineCap="round";
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{dn=drawn=true;const[x,y]=pt(e);g.beginPath();g.moveTo(x,y);cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(dn){const[x,y]=pt(e);g.lineTo(x,y);g.stroke()}};cv.onpointerup=()=>dn=false;
function clr(){g.clearRect(0,0,cv.width,cv.height);drawn=false}
(async()=>{if(!T)return $("st").textContent="Invalid link.";
try{const r=await call({action:"c_get"});if(!r.ok)return $("st").textContent=r.error;if(r.done)return $("st").textContent=r.message;
r.items.forEach(x=>{const tr=$("tb").insertRow();tr.insertCell().textContent=x[0];tr.insertCell().textContent=x[1]});
$("em").textContent=r.email;$("cs").textContent=r.consent;$("st").hidden=false;$("st").textContent="Please check the details below.";$("box").hidden=false}
catch(e){$("st").textContent="Could not load. Check your internet and reopen the link."}})();
$("ob").onclick=async()=>{$("m").textContent="Sending code...";const r=await call({action:"c_otp"});$("m").textContent=r.ok?"Code sent. Check your email (also spam).":r.error};
$("cb").onclick=async()=>{if(!drawn)return $("m").textContent="Please draw your signature.";$("m").textContent="Confirming...";
try{const r=await call({action:"c_confirm",otp:$("otp").value,name:$("nm").value,agree:$("ag").checked,sig:cv.toDataURL("image/png").split(",")[1],lat:POS&&POS.latitude,lng:POS&&POS.longitude,ua:navigator.userAgent});
if(r.ok){$("box").hidden=true;$("st").textContent=r.message}else $("m").textContent=r.error}catch(e){$("m").textContent="Network error. Please try again."}};
</script></body></html>
